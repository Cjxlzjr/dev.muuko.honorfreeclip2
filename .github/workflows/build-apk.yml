name: HonorFreeClip2 CI

on:
  workflow_dispatch:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.11.1'
      - name: Protocol, timeout, reconnect and release checks
        run: |
          set -euo pipefail
          bash tests/run_host_tests.sh | tee host-tests.log
      - name: Build unsigned APK, run Android layout tests and Lint
        run: gradle :app:assembleVerification :app:testVerificationUnitTest :app:lintVerification --no-daemon --stacktrace
      - name: Upload unsigned verification APK and reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: HonorFreeClip2-verification-${{ github.sha }}
          path: |
            app/build/outputs/apk/verification/*.apk
            app/build/reports/
            app/build/test-results/
            host-tests.log
          if-no-files-found: error
