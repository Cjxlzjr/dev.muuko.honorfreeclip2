name: HonorFreeClip2 Beta CI

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  debug-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Static release checks
        run: python3 tests/check_release.py
      - name: Host protocol and transport tests
        run: bash tests/run_host_tests.sh
      - name: Build Debug APK (not for public distribution)
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: HonorFreeClip2-v1.1.0-beta.2-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
