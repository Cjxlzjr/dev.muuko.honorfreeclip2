name: HonorFreeClip2 Signed Beta Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK 35 and apksigner
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Static release checks
        run: python3 tests/check_release.py
      - name: Host protocol and transport tests
        run: bash tests/run_host_tests.sh
      - name: Validate release signing credentials
        env:
          HF2_KEYSTORE_BASE64: ${{ secrets.HF2_KEYSTORE_BASE64 }}
          HF2_KEYSTORE_PASSWORD: ${{ secrets.HF2_KEYSTORE_PASSWORD }}
          HF2_KEY_ALIAS: ${{ secrets.HF2_KEY_ALIAS }}
          HF2_KEY_PASSWORD: ${{ secrets.HF2_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$HF2_KEYSTORE_BASE64" || { echo 'Missing keystore secret'; exit 1; }
          test -n "$HF2_KEYSTORE_PASSWORD" || { echo 'Missing store password'; exit 1; }
          test -n "$HF2_KEY_ALIAS" || { echo 'Missing key alias'; exit 1; }
          test -n "$HF2_KEY_PASSWORD" || { echo 'Missing key password'; exit 1; }
          mkdir -p "$RUNNER_TEMP/hf2_keys"
          chmod 700 "$RUNNER_TEMP/hf2_keys"
          printf '%s' "$HF2_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hf2_keys/release.jks"
          chmod 600 "$RUNNER_TEMP/hf2_keys/release.jks"
      - name: Build signed Release APK
        env:
          HF2_KEYSTORE_PATH: ${{ runner.temp }}/hf2_keys/release.jks
          HF2_KEYSTORE_PASSWORD: ${{ secrets.HF2_KEYSTORE_PASSWORD }}
          HF2_KEY_ALIAS: ${{ secrets.HF2_KEY_ALIAS }}
          HF2_KEY_PASSWORD: ${{ secrets.HF2_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Verify signature and output SHA-256
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/HonorFreeClip2-v1.1.0-beta.2-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/HonorFreeClip2-v1.1.0-beta.2-release.apk
          cd dist
          sha256sum HonorFreeClip2-v1.1.0-beta.2-release.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: HonorFreeClip2-v1.1.0-beta.2-signed-release
          path: |
            dist/HonorFreeClip2-v1.1.0-beta.2-release.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
