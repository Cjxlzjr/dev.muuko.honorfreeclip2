name: HonorFreeClip2 Signed Beta Release

# No push/tag trigger and no automatic publication. Run only after maintainer approval.
on:
  workflow_dispatch:
    inputs:
      confirm_signing:
        description: 'Authorize use of the existing release signing key'
        type: boolean
        required: true
        default: false
      create_draft:
        description: 'Prepare a draft prerelease (publishing remains manual)'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: signed-release
  cancel-in-progress: false

jobs:
  signed-release:
    if: inputs.confirm_signing && github.ref == 'refs/heads/main'
    environment: release-signing
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.11.1'
      - name: Validate source and version
        id: version
        run: |
          bash tests/run_host_tests.sh
          echo "tag=$(python3 scripts/release_metadata.py tag)" >> "$GITHUB_OUTPUT"
          echo "version=$(python3 scripts/release_metadata.py version)" >> "$GITHUB_OUTPUT"
      - name: Validate Android code and layout before accessing the signing key
        run: gradle :app:testVerificationUnitTest :app:lintVerification --no-daemon --stacktrace
      - name: Materialize existing signing key
        env:
          HF2_KEYSTORE_BASE64: ${{ secrets.HF2_KEYSTORE_BASE64 }}
          HF2_KEYSTORE_PASSWORD: ${{ secrets.HF2_KEYSTORE_PASSWORD }}
          HF2_KEY_ALIAS: ${{ secrets.HF2_KEY_ALIAS }}
          HF2_KEY_PASSWORD: ${{ secrets.HF2_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for key in HF2_KEYSTORE_BASE64 HF2_KEYSTORE_PASSWORD HF2_KEY_ALIAS HF2_KEY_PASSWORD; do
            test -n "${!key}" || { echo "Missing signing secret: $key"; exit 1; }
          done
          umask 077
          mkdir -p "$RUNNER_TEMP/hf2_keys"
          printf '%s' "$HF2_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hf2_keys/release.jks"
      - name: Build signed APK with existing key
        env:
          HF2_KEYSTORE_PATH: ${{ runner.temp }}/hf2_keys/release.jks
          HF2_KEYSTORE_PASSWORD: ${{ secrets.HF2_KEYSTORE_PASSWORD }}
          HF2_KEY_ALIAS: ${{ secrets.HF2_KEY_ALIAS }}
          HF2_KEY_PASSWORD: ${{ secrets.HF2_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Verify update certificate and package matching source
        run: bash scripts/prepare_dist.sh release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: HonorFreeClip2-v${{ steps.version.outputs.version }}-signed-release
          path: dist/
          if-no-files-found: error
      - name: Prepare draft prerelease (never publish automatically)
        if: inputs.create_draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" --draft --prerelease \
            --title "HonorFreeClip2 v$VERSION" --notes-file docs/RELEASE_NOTES.md
      - name: Remove temporary signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/hf2_keys"
